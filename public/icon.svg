<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#070b14" />
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="100" fill="url(#bgGrad)" />
  <rect width="512" height="512" rx="100" fill="none" stroke="#f59e0b" stroke-width="3" stroke-opacity="0.3" />
  
  <!-- Vinyl Rings -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#1e293b" stroke-width="2" />
  <circle cx="256" cy="256" r="160" fill="none" stroke="#1e293b" stroke-width="2" />
  <circle cx="256" cy="256" r="130" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="8 6" />
  <circle cx="256" cy="256" r="100" fill="none" stroke="url(#goldGrad)" stroke-width="3" filter="url(#goldGlow)" />

  <!-- MS2 Brand Centerpiece -->
  <g filter="url(#goldGlow)">
    <text x="256" y="240" font-family="system-ui, -apple-system, sans-serif" font-size="82" font-weight="900" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="2">MS2</text>
    <text x="256" y="280" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#fef08a" text-anchor="middle" letter-spacing="6">-SM</text>
  </g>

  <!-- Audio Wave Bars on sides -->
  <g fill="url(#goldGrad)" opacity="0.8">
    <rect x="70" y="236" width="6" height="40" rx="3" />
    <rect x="84" y="216" width="6" height="80" rx="3" />
    <rect x="98" y="246" width="6" height="20" rx="3" />
    <rect x="408" y="246" width="6" height="20" rx="3" />
    <rect x="422" y="216" width="6" height="80" rx="3" />
    <rect x="436" y="236" width="6" height="40" rx="3" />
  </g>
</svg>
